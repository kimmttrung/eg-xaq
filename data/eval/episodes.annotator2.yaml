# Bộ episode đánh giá EG-XAQ — PHIẾU GÁN NHÃN
# =============================================================================
# ⚠ PHIẾU NGƯỜI GÁN NHÃN THỨ HAI — gán ĐỘC LẬP, KHÔNG mở phiếu của người kia.
# Đọc data/eval/LABELING.md trước khi gán nhãn.
#
# Ngày được chọn tự động theo PM2.5 quan trắc: dataset_train.csv, 769 ngày (2022-01-04 → 2024-12-11)
# Nhãn nguyên nhân PHẢI lấy từ nguồn độc lập (CEM, bài báo, bản tin có chuyên gia).
# Không tìm được nguồn → đổi status thành rejected và ghi reject_reason.
#
# ⚠ Hỏi mentor (M10): các ngày này có nằm trong tập huấn luyện của mô hình lab không.
#
# Cơ chế hợp lệ (↑ làm tăng PM2.5, ↓ làm giảm):
#   MECH_LOW_PBLH                  ↑ Tích tụ do lớp xáo trộn thấp
#   MECH_STAGNATION                ↑ Tù đọng do gió yếu
#   MECH_INVERSION                 ↑ Nghịch nhiệt giữ ô nhiễm
#   MECH_POOR_VENTILATION          ↑ Thông thoáng khí quyển kém
#   MECH_MULTIDAY_ACCUMULATION     ↑ Tích tụ cộng dồn nhiều ngày
#   MECH_ANTICYCLONIC              ↑ Chìm lún dưới cao áp
#   MECH_BIOMASS_TRANSPORT         ↑ Vận chuyển khói đốt sinh khối
#   MECH_SOURCE_SECTOR_TRANSPORT   ↑ Vận chuyển từ cụm nguồn thượng nguồn gió
#   MECH_SECONDARY_AEROSOL         ↑ Sol khí thứ cấp & hút ẩm phình to
#   MECH_WET_DEPOSITION            ↓ Rửa trôi bởi mưa
#   MECH_ADVECTION_CLEANSING       ↓ Gió mạnh thổi sạch
#   MECH_NO_WET_REMOVAL            ↑ Vắng mặt cơ chế rửa trôi

